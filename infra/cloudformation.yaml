AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Infra for the batch ETL pipeline: raw/processed S3 buckets, a Glue ETL job
  with its IAM role, and a Redshift Serverless namespace/workgroup as the
  warehouse target. Deploy with:
    aws cloudformation deploy --template-file infra/cloudformation.yaml \
      --stack-name de-intern-batch-etl --capabilities CAPABILITY_NAMED_IAM

Parameters:
  ProjectName:
    Type: String
    Default: de-intern-batch-etl
  RedshiftAdminPassword:
    Type: String
    NoEcho: true
    MinLength: 8

Resources:
  RawBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-raw-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled

  ProcessedBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-processed-${AWS::AccountId}"

  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-glue-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: glue.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["s3:GetObject", "s3:PutObject", "s3:ListBucket"]
                Resource:
                  - !GetAtt RawBucket.Arn
                  - !Sub "${RawBucket.Arn}/*"
                  - !GetAtt ProcessedBucket.Arn
                  - !Sub "${ProcessedBucket.Arn}/*"

  GlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub "${ProjectName}-etl-job"
      Role: !Ref GlueJobRole
      GlueVersion: "4.0"
      Command:
        Name: glueetl
        ScriptLocation: !Sub "s3://${ProcessedBucket}/scripts/etl_job.py"
        PythonVersion: "3"
      DefaultArguments:
        "--RAW_PATH": !Sub "s3://${RawBucket}/sales/"
        "--OUTPUT_PATH": !Sub "s3://${ProcessedBucket}/warehouse/"
        "--job-language": "python"
      MaxRetries: 0
      NumberOfWorkers: 2
      WorkerType: G.1X

  RedshiftNamespace:
    Type: AWS::RedshiftServerless::Namespace
    Properties:
      NamespaceName: !Sub "${ProjectName}-ns"
      DbName: salesdb
      AdminUsername: admin
      AdminUserPassword: !Ref RedshiftAdminPassword

  RedshiftWorkgroup:
    Type: AWS::RedshiftServerless::Workgroup
    Properties:
      WorkgroupName: !Sub "${ProjectName}-wg"
      NamespaceName: !Ref RedshiftNamespace
      BaseCapacity: 32
      PubliclyAccessible: false

  RedshiftCopyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-redshift-copy-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: redshift.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["s3:GetObject", "s3:ListBucket"]
                Resource:
                  - !GetAtt ProcessedBucket.Arn
                  - !Sub "${ProcessedBucket.Arn}/*"

Outputs:
  RawBucketName:
    Value: !Ref RawBucket
  ProcessedBucketName:
    Value: !Ref ProcessedBucket
  GlueJobName:
    Value: !Ref GlueJob
  RedshiftWorkgroupName:
    Value: !Ref RedshiftWorkgroup
  RedshiftCopyRoleArn:
    Value: !GetAtt RedshiftCopyRole.Arn
